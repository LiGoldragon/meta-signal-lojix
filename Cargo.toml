[package]
name         = "meta-signal-lojix"
version      = "0.4.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
description  = "Meta Signal contract for the lojix deploy orchestrator owner-only policy surface."
publish      = false
links        = "meta-signal-lojix"
build        = "build.rs"

[lib]
name = "meta_signal_lojix"
path = "src/lib.rs"

[features]
default   = []
nota-text = ["dep:nota", "signal-lojix/nota-text", "signal-frame/nota-text"]

[dependencies]
nota    = { git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "8346bc3f1a734dc9d61aef1f858f9b4ca72e59e3" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main", default-features = false }

[build-dependencies]
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "9987c588cad8da6507c378dad5d3cbeef3eebad1" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
